apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: monitoring
  namespace: elastic-system
spec: # https://www.elastic.co/docs/deploy-manage/deploy/cloud-on-k8s/elasticsearch-configuration
  auth:
    disableElasticUser: true
  http:
    tls:
      selfSignedCertificate:
        disabled: true
  nodeSets:
    - config:
        cluster.routing.allocation.disk.watermark.flood_stage: 95%
        cluster.routing.allocation.disk.watermark.high: 90%
        cluster.routing.allocation.disk.watermark.low: 85%
        http.max_content_length: 1gb
        indices.breaker.total.limit: 85%
        indices.fielddata.cache.size: 20%
        ingest.geoip.downloader.enabled: false
        node.store.allow_mmap: true
        xpack.monitoring.collection.enabled: true
        xpack.security.authc:
          anonymous: # https://www.elastic.co/docs/deploy-manage/users-roles/cluster-or-deployment-auth/anonymous-access
            authz_exception: false
            roles: superuser
            username: elastic # _es_anonymous_user
      count: 3
      name: all
      podTemplate:
        spec:
          containers:
            - env:
                - name: ES_JAVA_OPTS
                  value: -Des.search.ignore_awareness_attributes=true
                - name: READINESS_PROBE_PROTOCOL
                  value: http
                - name: TZ
                  value: Asia/Shanghai
              name: elasticsearch
              resources:
                limits:
                  cpu: 1
                  memory: 1Gi
                requests:
                  cpu: 1
                  memory: 1Gi
          enableServiceLinks: false
          initContainers:
            - command:
                - sh
                - -c
                - sysctl -w vm.max_map_count=262144 && chown -R elasticsearch:elasticsearch /data
              name: elasticsearch-sysctl
              securityContext:
                privileged: true
                runAsUser: 0
              volumeMounts:
                - mountPath: /data
                  name: elasticsearch-data
          nodeSelector:
            kubernetes.io/os: linux
          topologySpreadConstraints:
            - labelSelector:
                matchLabels:
                  elasticsearch.k8s.elastic.co/node-master: "true"
              maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
      volumeClaimTemplates:
        - apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: elasticsearch-data # https://www.elastic.co/docs/deploy-manage/deploy/cloud-on-k8s/volume-claim-templates
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 50Gi
            storageClassName: local-path
  version: 8.19.20 # https://www.elastic.co/guide/en/elasticsearch/reference/8.19/es-release-notes.html
  volumeClaimDeletePolicy: DeleteOnScaledownOnly
