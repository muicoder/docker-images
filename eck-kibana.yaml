apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: internal
  namespace: elastic-system
spec:
  config:
    server:
      basePath: /elastic-system/internal-kibana
      rewriteBasePath: true
    telemetry.enabled: false
    xpack.reporting.roles.enabled: false
  count: 2
  elasticsearchRef:
    name: internal
  http:
    tls:
      selfSignedCertificate:
        disabled: true
  monitoring:
    logs:
      elasticsearchRefs:
        - name: internal
    metrics:
      elasticsearchRefs:
        - name: internal
  podTemplate:
    spec:
      containers:
        - command:
            - bash
            - -ce
            - echo |base64 -d>data/$(whoami).sh;exec bash data/$(whoami).sh
          name: metricbeat
        - command:
            - bash
            - -ce
            - echo |base64 -d>data/$(whoami).sh;exec bash data/$(whoami).sh
          name: filebeat
        - env:
            - name: TZ
              value: Asia/Shanghai
          name: kibana
          readinessProbe:
            tcpSocket:
              port: http
          resources:
            limits:
              cpu: 1
              memory: 1Gi
            requests:
              cpu: 1
              memory: 1Gi
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/os: linux
  version: 7.17.29
