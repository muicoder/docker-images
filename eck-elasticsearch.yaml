apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: internal
  namespace: elastic-system
spec:
  http:
    tls:
      selfSignedCertificate:
        disabled: true
  monitoring:
    logs:
      elasticsearchRefs:
        - name: internal
    metrics:
      elasticsearchRefs:
        - name: internal
  nodeSets:
    - config:
        cluster.routing.allocation.disk.watermark.flood_stage: 95%
        cluster.routing.allocation.disk.watermark.high: 90%
        cluster.routing.allocation.disk.watermark.low: 85%
        http.max_content_length: 1gb
        indices.breaker.total.limit: 85%
        indices.fielddata.cache.size: 20%
        ingest.geoip.downloader.enabled: false
        node.store.allow_mmap: true
      count: 3
      name: all
      podTemplate:
        spec:
          containers:
            - command:
                - bash
                - -ce
                - echo |base64 -d>data/$(whoami).sh;exec bash data/$(whoami).sh
              name: metricbeat
            - command:
                - bash
                - -ce
                - echo |base64 -d>data/$(whoami).sh;exec bash data/$(whoami).sh
              name: filebeat
            - env:
                - name: ES_JAVA_OPTS
                  value: -Des.search.ignore_awareness_attributes=true
                - name: READINESS_PROBE_PROTOCOL
                  value: http
                - name: TZ
                  value: Asia/Shanghai
              name: elasticsearch
              resources:
                limits:
                  cpu: 4
                  memory: 8Gi
                requests:
                  cpu: 4
                  memory: 8Gi
          enableServiceLinks: false
          initContainers:
            - command:
                - sh
                - -c
                - sysctl -w vm.max_map_count=262144 && chown -R elasticsearch:elasticsearch /data
              name: elasticsearch-sysctl
              securityContext:
                privileged: true
                runAsUser: 0
              volumeMounts:
                - mountPath: /data
                  name: elasticsearch-data
          nodeSelector:
            kubernetes.io/os: linux
          topologySpreadConstraints:
            - labelSelector:
                matchLabels:
                  elasticsearch.k8s.elastic.co/node-master: "true"
              maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
      volumeClaimTemplates:
        - apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: elasticsearch-data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 500Gi
            storageClassName: local-path
  version: 7.17.29
  volumeClaimDeletePolicy: DeleteOnScaledownOnly
